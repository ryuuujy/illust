<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Illustration Portfolio</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    color:#1a1a1a;
    background:#fff;
    line-height:1.5;
  }
  a{color:inherit;text-decoration:none;}

  .layout{
    display:flex;
    align-items:flex-start;
  }

  aside{
    width:260px;
    flex:none;
    padding:40px 28px;
    position:sticky;
    top:0;
    height:100vh;
    border-right:1px solid #eee;
    display:flex;
    flex-direction:column;
  }
  aside h1{
    font-size:17px;
    font-weight:600;
  }
  aside .intro{
    font-size:13px;
    color:#555;
    margin-top:14px;
  }
  aside .contact{
    margin-top:auto;
    font-size:12px;
    color:#777;
  }
  aside .contact a{
    display:block;
    margin-top:6px;
  }
  aside .contact a:hover{color:#1a1a1a;}

  main{
    flex:1;
    min-width:0;
  }

  .grid{
    display:grid;
    grid-template-columns:repeat(4, 1fr);
    gap:24px 20px;
    padding:24px;
  }
  @media(max-width:1024px){ .grid{grid-template-columns:repeat(3, 1fr);} }
  @media(max-width:820px){
    .layout{flex-direction:column;}
    aside{width:100%;height:auto;position:static;border-right:none;border-bottom:1px solid #eee;flex-direction:row;flex-wrap:wrap;align-items:center;gap:16px 32px;}
    aside .contact{margin-top:0;}
    .grid{grid-template-columns:repeat(2, 1fr);}
  }
  @media(max-width:480px){ .grid{grid-template-columns:repeat(1, 1fr);} }

  .item{ cursor:pointer; }
  .item .thumb{
    position:relative;
    aspect-ratio:1/1;
    background:#f2f2f2;
    overflow:hidden;
  }
  .item .thumb img{
    width:100%;height:100%;
    object-fit:cover;
    display:block;
  }
  .item .thumb .placeholder{
    width:100%;height:100%;
    display:flex;align-items:center;justify-content:center;
    color:#999;font-size:12px;
    background:#eee;
  }
  .item .caption{
    padding:8px 2px 0;
    font-size:12.5px;
    color:#555;
  }

  .year-label{
    grid-column:1/-1;
    padding:20px 10px 8px;
    font-size:12px;
    color:#999;
    letter-spacing:0.05em;
  }

  /* ---------- lightbox ---------- */
  .lightbox{
    position:fixed;inset:0;
    background:rgba(0,0,0,0.92);
    display:none;
    flex-direction:column;
    align-items:center;justify-content:center;
    z-index:100;
    padding:16px;
  }
  .lightbox.open{display:flex;}

  .lb-main{
    position:relative;
    display:flex;align-items:center;justify-content:center;
    width:100%;
    flex:1;
    min-height:0;
  }
  .lb-main img{
    max-width:96vw;
    max-height:100%;
    object-fit:contain;
  }
  .lb-main .lb-placeholder{
    width:min(90vw,900px);
    aspect-ratio:1/1;
    max-height:100%;
    background:#333;
    color:#999;
    display:flex;align-items:center;justify-content:center;
    font-size:13px;
  }

  .lb-caption{
    color:#eee;
    font-size:13px;
    margin-top:12px;
    text-align:center;
  }

  .lb-strip{
    display:flex;
    gap:8px;
    margin-top:16px;
    max-width:96vw;
    overflow-x:auto;
    padding-bottom:2px;
  }
  .lb-strip .lb-thumb{
    width:64px;height:64px;
    flex:none;
    background:#222;
    overflow:hidden;
    cursor:pointer;
    opacity:0.5;
    border:2px solid transparent;
    transition:opacity .15s,border-color .15s;
  }
  .lb-strip .lb-thumb img{
    width:100%;height:100%;object-fit:cover;display:block;
  }
  .lb-strip .lb-thumb.active{
    opacity:1;
    border-color:#fff;
  }
  .lb-strip .lb-thumb:hover{opacity:0.85;}

  .lb-close{
    position:absolute;top:20px;right:28px;
    color:#eee;font-size:28px;
    background:none;border:none;cursor:pointer;
    line-height:1;
  }
  .lb-close:hover{color:#fff;}
  .lb-nav{
    position:absolute;top:50%;transform:translateY(-50%);
    background:none;border:none;color:#eee;
    font-size:32px;cursor:pointer;padding:10px 16px;
    z-index:2;
  }
  .lb-nav:hover{color:#fff;}
  .lb-prev{left:0;}
  .lb-next{right:0;}
  @media(max-width:600px){
    .lb-nav{font-size:24px;padding:8px 10px;}
    .lb-close{top:12px;right:16px;font-size:24px;}
    .lb-strip .lb-thumb{width:48px;height:48px;}
  }

  footer{
    padding:28px 24px;
    font-size:12px;
    color:#999;
    border-top:1px solid #eee;
  }
</style>
</head>
<body>

<div class="layout">
<aside>
  <h1>[이름]</h1>
  <p class="intro">그림책과 일러스트를 만듭니다. 여기에 짧은 소개 문구를 적어주세요.</p>
  <div class="contact">
    <a href="mailto:contact@example.com">contact@example.com</a>
    <a href="https://instagram.com/" target="_blank" rel="noopener">Instagram</a>
  </div>
</aside>

<main>
  <div class="grid" id="grid"></div>
</main>
</div>

<div class="lightbox" id="lightbox">
  <button class="lb-close" onclick="closeLightbox()">&times;</button>
  <div class="lb-main">
    <button class="lb-nav lb-prev" onclick="navImage(-1)">&#8249;</button>
    <img id="lb-img" alt="">
    <button class="lb-nav lb-next" onclick="navImage(1)">&#8250;</button>
  </div>
  <div class="lb-caption" id="lb-caption"></div>
  <div class="lb-strip" id="lb-strip"></div>
</div>

<footer>
  <p>&nbsp;</p>
</footer>

<script>
  /* ---------------------------------------------------------
     프로젝트 데이터: 여기만 수정하면 갤러리가 자동으로 만들어집니다.
     - title: 프로젝트 제목 (메인 화면 썸네일 아래 표시)
     - year: 연도 구분 라벨
     - images: 해당 프로젝트의 이미지들. 첫 번째가 대표(커버) 이미지.
       각 이미지는 { src: '파일명.jpg', caption: '이미지 설명' }
  --------------------------------------------------------- */
  const projects = [
    {
      year: 2026,
      title: '작은 새',
      images: [
        { src: 'work-2026-01.jpg', caption: '작은 새 — 표지' },
        { src: 'work-2026-02.jpg', caption: '작은 새 — 내지 1' },
        { src: 'work-2026-03.jpg', caption: '작은 새 — 내지 2' },
        { src: 'work-2026-04.jpg', caption: '작은 새 — 내지 3' },
        { src: 'work-2026-05.jpg', caption: '작은 새 — 내지 4' },
      ]
    },
    {
      year: 2026,
      title: '프로젝트 제목 2',
      images: [
        { src: 'work-2026b-01.jpg', caption: '이미지 1' },
        { src: 'work-2026b-02.jpg', caption: '이미지 2' },
        { src: 'work-2026b-03.jpg', caption: '이미지 3' },
      ]
    },
    {
      year: 2026,
      title: '프로젝트 제목 3',
      images: [
        { src: 'work-2026c-01.jpg', caption: '이미지 1' },
        { src: 'work-2026c-02.jpg', caption: '이미지 2' },
      ]
    },
    {
      year: 2025,
      title: '프로젝트 제목 4',
      images: [
        { src: 'work-2025-01.jpg', caption: '이미지 1' },
        { src: 'work-2025-02.jpg', caption: '이미지 2' },
        { src: 'work-2025-03.jpg', caption: '이미지 3' },
        { src: 'work-2025-04.jpg', caption: '이미지 4' },
        { src: 'work-2025-05.jpg', caption: '이미지 5' },
      ]
    },
    {
      year: 2025,
      title: '프로젝트 제목 5',
      images: [
        { src: 'work-2025b-01.jpg', caption: '이미지 1' },
        { src: 'work-2025b-02.jpg', caption: '이미지 2' },
        { src: 'work-2025b-03.jpg', caption: '이미지 3' },
      ]
    },
    {
      year: 2025,
      title: '프로젝트 제목 6',
      images: [
        { src: 'work-2025c-01.jpg', caption: '이미지 1' },
        { src: 'work-2025c-02.jpg', caption: '이미지 2' },
        { src: 'work-2025c-03.jpg', caption: '이미지 3' },
        { src: 'work-2025c-04.jpg', caption: '이미지 4' },
      ]
    },
    {
      year: 2025,
      title: '프로젝트 제목 7',
      images: [
        { src: 'work-2025d-01.jpg', caption: '이미지 1' },
        { src: 'work-2025d-02.jpg', caption: '이미지 2' },
      ]
    },
    {
      year: 2024,
      title: '프로젝트 제목 8',
      images: [
        { src: 'work-2024-01.jpg', caption: '이미지 1' },
        { src: 'work-2024-02.jpg', caption: '이미지 2' },
        { src: 'work-2024-03.jpg', caption: '이미지 3' },
        { src: 'work-2024-04.jpg', caption: '이미지 4' },
        { src: 'work-2024-05.jpg', caption: '이미지 5' },
      ]
    },
    {
      year: 2024,
      title: '프로젝트 제목 9',
      images: [
        { src: 'work-2024b-01.jpg', caption: '이미지 1' },
        { src: 'work-2024b-02.jpg', caption: '이미지 2' },
        { src: 'work-2024b-03.jpg', caption: '이미지 3' },
      ]
    },
  ];

  /* ---------- 메인 그리드 렌더링 (프로젝트 단위) ---------- */
  const grid = document.getElementById('grid');
  let lastYear = null;

  projects.forEach((project, projectIndex) => {
    if (project.year !== lastYear) {
      const yearLabel = document.createElement('div');
      yearLabel.className = 'year-label';
      yearLabel.textContent = project.year;
      grid.appendChild(yearLabel);
      lastYear = project.year;
    }

    const cover = project.images[0];

    const item = document.createElement('div');
    item.className = 'item';
    item.onclick = () => openLightbox(projectIndex, 0);

    const thumb = document.createElement('div');
    thumb.className = 'thumb';
    const img = document.createElement('img');
    img.src = cover.src;
    img.alt = project.title;
    img.onerror = function(){
      this.replaceWith(Object.assign(document.createElement('div'), {
        className: 'placeholder',
        textContent: cover.src
      }));
    };
    thumb.appendChild(img);

    const caption = document.createElement('div');
    caption.className = 'caption';
    caption.textContent = project.title;

    item.appendChild(thumb);
    item.appendChild(caption);
    grid.appendChild(item);
  });

  /* ---------- 라이트박스 ---------- */
  const lightbox = document.getElementById('lightbox');
  const lbCaption = document.getElementById('lb-caption');
  const lbStrip = document.getElementById('lb-strip');
  let currentProject = 0;
  let currentImage = 0;

  function setMainImage(src, caption){
    const old = document.getElementById('lb-img');
    const wrap = old.parentElement;
    const fresh = document.createElement('img');
    fresh.id = 'lb-img';
    fresh.alt = caption;
    fresh.onerror = function(){
      this.replaceWith(Object.assign(document.createElement('div'), {
        className: 'lb-placeholder',
        id: 'lb-img',
        textContent: src
      }));
    };
    old.replaceWith(fresh);
    fresh.src = src;
    lbCaption.textContent = caption;
  }

  function renderStrip(){
    lbStrip.innerHTML = '';
    const images = projects[currentProject].images;
    images.forEach((image, index) => {
      const t = document.createElement('div');
      t.className = 'lb-thumb' + (index === currentImage ? ' active' : '');
      t.onclick = (e) => { e.stopPropagation(); showImage(currentProject, index); };
      const im = document.createElement('img');
      im.src = image.src;
      im.alt = image.caption;
      im.onerror = function(){ this.style.display = 'none'; t.style.background = '#111'; };
      t.appendChild(im);
      lbStrip.appendChild(t);
    });
  }

  function showImage(projectIndex, imageIndex){
    currentProject = projectIndex;
    const images = projects[currentProject].images;
    currentImage = (imageIndex + images.length) % images.length;
    const image = images[currentImage];
    setMainImage(image.src, projects[currentProject].title + ' — ' + image.caption);
    renderStrip();
  }

  function openLightbox(projectIndex, imageIndex){
    showImage(projectIndex, imageIndex);
    lightbox.classList.add('open');
  }

  function closeLightbox(){
    lightbox.classList.remove('open');
  }

  function navImage(dir){
    showImage(currentProject, currentImage + dir);
  }

  lightbox.addEventListener('click', function(e){
    if(e.target === lightbox) closeLightbox();
  });

  document.addEventListener('keydown', function(e){
    if(!lightbox.classList.contains('open')) return;
    if(e.key === 'Escape') closeLightbox();
    if(e.key === 'ArrowLeft') navImage(-1);
    if(e.key === 'ArrowRight') navImage(1);
  });
</script>

</body>
</html>
