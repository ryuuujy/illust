<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Illustration Portfolio</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    color:#1a1a1a;
    background:#fff;
    line-height:1.5;
  }
  a{color:inherit;text-decoration:none;}

  .layout{
    display:flex;
    align-items:flex-start;
  }

  aside{
    width:260px;
    flex:none;
    padding:40px 28px;
    position:sticky;
    top:0;
    height:100vh;
    border-right:1px solid #eee;
    display:flex;
    flex-direction:column;
  }
  aside h1{
    font-size:17px;
    font-weight:600;
  }
  aside .intro{
    font-size:13px;
    color:#555;
    margin-top:14px;
  }
  aside .contact{
    margin-top:auto;
    font-size:12px;
    color:#777;
  }
  aside .contact a{
    display:block;
    margin-top:6px;
  }
  aside .contact a:hover{color:#1a1a1a;}

  main{
    flex:1;
    min-width:0;
  }

  .grid{
    display:grid;
    grid-template-columns:repeat(4, 1fr);
    gap:2px;
    padding:2px;
  }
  @media(max-width:1024px){ .grid{grid-template-columns:repeat(3, 1fr);} }
  @media(max-width:820px){
    .layout{flex-direction:column;}
    aside{width:100%;height:auto;position:static;border-right:none;border-bottom:1px solid #eee;flex-direction:row;flex-wrap:wrap;align-items:center;gap:16px 32px;}
    aside .contact{margin-top:0;}
    .grid{grid-template-columns:repeat(2, 1fr);}
  }
  @media(max-width:480px){ .grid{grid-template-columns:repeat(1, 1fr);} }

  .item{
    position:relative;
    aspect-ratio:1/1;
    background:#f2f2f2;
    overflow:hidden;
  }
  .item img{
    width:100%;height:100%;
    object-fit:cover;
    display:block;
  }
  .item .placeholder{
    width:100%;height:100%;
    display:flex;align-items:center;justify-content:center;
    color:#999;font-size:12px;
    background:#eee;
  }
  .item .caption{
    position:absolute;left:0;right:0;bottom:0;
    padding:8px 10px;
    background:linear-gradient(transparent, rgba(0,0,0,0.55));
    color:#fff;
    font-size:12px;
    opacity:0;
    transition:opacity .15s;
  }
  .item:hover .caption{opacity:1;}

  .year-label{
    grid-column:1/-1;
    padding:20px 10px 8px;
    font-size:12px;
    color:#999;
    letter-spacing:0.05em;
  }

  footer{
    padding:28px 24px;
    font-size:12px;
    color:#999;
    border-top:1px solid #eee;
  }
</style>
</head>
<body>

<div class="layout">
<aside>
  <h1>[이름]</h1>
  <p class="intro">그림책과 일러스트를 만듭니다. 여기에 짧은 소개 문구를 적어주세요.</p>
  <div class="contact">
    <a href="mailto:contact@example.com">contact@example.com</a>
    <a href="https://instagram.com/" target="_blank" rel="noopener">Instagram</a>
  </div>
</aside>

<div class="grid">

  <div class="item">
